server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

management:
  server:
    port: ${MANAGEMENT_PORT:8080}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: livenessState

spring:
  application:
    name: campus-errand-grab

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_errand?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      pool-name: errand-pool

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:200ms}

  task:
    scheduling:
      pool:
        size: 4

app:
  grab:
    # Flip to false to measure the same correctness with N x more DB writes.
    redis-prefilter-enabled: ${REDIS_PREFILTER_ENABLED:true}
    marker-ttl-slack-seconds: ${MARKER_TTL_SLACK_SECONDS:30}
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
    rate-limit-per-user: ${RATE_LIMIT_PER_USER:30}
    rate-limit-per-order: ${RATE_LIMIT_PER_ORDER:200}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:10}
  order:
    claim-ttl-seconds: 300
    deliver-ttl-seconds: 3600
  commission:
    rate: 0.10
    platform-user-id: 2
  recon:
    interval-ms: 60000
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me}
    previous-jwt-secret: ${JWT_PREVIOUS_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    require-redis-password: ${REQUIRE_REDIS_PASSWORD:false}
    login-failure-limit: ${LOGIN_FAILURE_LIMIT:5}
    login-ip-failure-limit: ${LOGIN_IP_FAILURE_LIMIT:30}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:60}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  payment:
    enabled: ${PAYMENT_ENABLED:true}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-payment-webhook-secret}
    webhook-skew-seconds: ${PAYMENT_WEBHOOK_SKEW_SECONDS:300}
